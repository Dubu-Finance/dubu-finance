ask_capacity = "20"

# 5 seconds. This is the DEAD-MAN HEARTBEAT, not a refresh convenience.
#
# It was 2400 (two thirds of a 3600s maxStaleSecs), which meant it effectively never fired: every
# push observed on a live run came from adverse_drift instead. That left "the bot is dead" and
# "the market is quiet" looking identical from the chain's side -- measured on pair 2, 12% of the
# intervals between pushes exceeded 15s and one reached 103s, with nothing wrong.
#
# A staleness bound can only be tight if a push is guaranteed, so the push is now guaranteed. This
# is what Binance's Auto-Cancel kill-switch requires of an options market maker for the same
# reason, and what pairDecay / maxStaleSecs on chain are sized against below.
#
# Cost: 2 pairs x 12 pushes a minute x 0.00000012 ETH = 0.0041 ETH a day.
heartbeat_secs = 5
adverse_drift_bps = 0.5
favourable_drift_bps = 5
capacity_divergence_pct = 30

[pairs.venues]
