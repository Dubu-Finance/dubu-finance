[rfq]
private_key_env = "RFQ_PRIVATE_KEY"
pmm_settle = "0x68CFa6E265AffD5D0DB2C49E4bb9DaEC5A920A9E"
# 3 bp base, widening with volatility, capped at 20 bp. Tighter than the curve's standing quote
# because an RFQ price is quoted after the size is known -- see `quoting`'s module docs.
# 1 bp, matching the curve's new floor. Leaving it at 3 bp would have made the RFQ leg
# quote WORSE than the curve it is supposed to beat on size -- the aggregator would have
# routed around it and the leg would have looked broken rather than mispriced.
#
# The TTL premium is added on top, so what RFQ actually quotes is 1 bp + sigma + the cost
# of the 5s option it writes. That is the design working: RFQ pays for its own optionality
# rather than being handed a flat number that hides it.
base_half_spread_e2 = 100
# Matches the curve's re-derived s1 of 0.58: this field is hundredths of a bp per millibp
# of sigma, so 0.58 bp per bp is 58 here... but the curve's sigma is over 300s and this one
# is rescaled to the TTL, so the two are not the same multiplier. Kept at the curve's slope
# so the two surfaces widen together in a volatile market.
sigma_coefficient_e2 = 29
max_half_spread_e2 = 2000
# $100k in one order. Denominated in money rather than tokens: "50" would mean 50 mWETH on one
# pair and 50 mWBTC on another, a fifty-fold difference in the risk one order can take.
max_notional_per_order = "100000"
quote_decimals = 6
# 5 seconds, not 30. A signed order is an option the taker exercises when it suits them, and its
# value grows with sqrt(TTL) -- so the spread charges for it (see quoting::ttl_premium_e2) and a
# long TTL is expensive rather than free.
#
# The floor is the chain, not taste. An earlier note here cited "950ms send-to-confirmed", which
# was a bad measurement -- it was our own receipt polling cadence, not the chain. Measured
# properly, a transaction is visible in a preconfirmation in as little as 5ms and in a confirmed
# block in about a second. The taker's fill only has to be included while the order is unexpired,
# and inclusion is the preconfirmation, so the true floor is well under a second.
#
# 5s is kept anyway, for a reason the latency number never addressed: a preconfirmation can be
# reorganised, and a taker who fills against one wants the order still valid if their transaction
# is re-included a block later. Buying that costs about 0.2bp of premium over a 3s TTL, which is
# a better trade than discovering the alternative in production.
# 2 seconds. The TTL is an option the maker writes, priced by quoting::ttl_premium_e2 and growing
# with sqrt(TTL), so shorter is cheaper -- 5s cost 0.58bp of spread at today's sigma, 2s costs 0.37.
#
# The floor is the taker's round trip, measured rather than guessed:
#   quote round trip   ~78ms   (edge)
#   sign and submit    ~50ms
#   inclusion         440ms median, 508ms max   (six transactions)
#   ----------------------------------
#                    ~640ms worst observed
# 2s leaves 3.1x margin. 1s would leave 1.6x, which one slow sequencer moment turns into an order
# that expires in flight -- and an expired order costs the taker gas for a revert, which is worse
# than never quoting.
ttl_secs = 2
min_fill_bps = 1000

[rfq.serve]
bind = "127.0.0.1:8790"

# ---------------------------------------------------------------------------
# THE HEDGE LEG
# ---------------------------------------------------------------------------
#
# Without this the ladder has to price the risk of holding whatever it buys until somebody happens
# to sell it back, and that holding time is unbounded. It is why `width_bps` is 25 when the measured
# cost of actually unwinding 1,000 ETH on Binance is 3.8 bp -- six times steeper than the venue
# charges, and the whole gap is insurance against a risk this removes.
#
# TESTNET ON BOTH SIDES, deliberately. The pool trades mock tokens; hedging that on the live
# exchange would leave the only real position in the system with nothing behind it. Testnet USD-M
# tracks the live price closely enough to prove the mechanism -- measured, ETHUSDT read 1,877.06
# there against 1,877.07 live. What it cannot prove is slippage, so the depth curve is measured
# against the LIVE public book, which needs no key.
[hedge]
base_url = "https://testnet.binancefuture.com"
key_env = "BINANCE_TESTNET_API_KEY"
secret_env = "BINANCE_TESTNET_API_SECRET"

# Binance USD-M taker, standard tier: 4 bp. Not a VIP figure -- those need volume we do not have,
# and assuming them would derive an interval we are not entitled to.
taker_fee_bps_e2 = 400

timeout_ms = 5000

# Binance compares timestamps against ITS OWN clock, so a host that drifts starts failing every
# signed call at once with an error that names the timestamp and not the cause. Measured today:
# -1021 on the first attempt, before the offset was applied.
clock_resync_secs = 300

# The crossing INTERVAL is not configured. It is derived from the fee above and measured sigma --
# `(fee/sigma)^2`, about 45 seconds at ETHUSDT's 0.594 bp per root-second. Below that a crossing
# spends more on fees than the exposure it clears was worth. Whatever drift accumulates in that
# window becomes the band, so the width adapts to flow without anyone knowing what the flow is.

[[hedge.pairs]]
pair_id = 1
symbol = "ETHUSDT"
# Binance USD-M ETHUSDT steps in 0.001 contracts.
qty_decimals = 3
# 0.01 ETH, above the venue's minimum with room to spare.
min_qty_base = "10000000000000000"
# 25 ETH. A RISK CHOICE, not a derivation: it bounds what a burst can build up before the derived
# interval elapses. The interval is what makes the hedge cheap; this is what stops it being slow.
