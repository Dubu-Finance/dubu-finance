# dubu-updater — GIWA Sepolia (chain 91342), the live deployment in contracts/DEPLOYMENTS.md.
#
# Unknown keys are a hard error, not a silent default, so a typo here fails at startup rather
# than quoting a spread nobody chose. Amounts are decimal strings in HUMAN units (TOML integers
# are i64 and a thousand mWETH is 10^21).
#
# NO SECRETS IN THIS FILE. The endpoint URLs are `${VAR}` templates expanded from the
# environment at load; copy `.env.example` to `.env` (gitignored) and put the key there. An
# unset variable is a startup error naming the variable. Every URL is redacted to
# `scheme://host/***` in every log line — see `config::EndpointUrl`.
#
# Run it dry:   cargo run -p dubu-updater -- --config crates/dubu-updater/updater.toml --once

[chain]
# ---------------------------------------------------------------------------
# THREE ENDPOINTS, THREE JOBS. This is not redundancy; it is three different
# freshness guarantees, and using the wrong one for a job is a real bug.
#
#   ws_url               newHeads -> DRIVES THE LOOP        1s, confirmed
#   flashblocks_rpc_url  every state read, `pending` tag    ~200ms, preconfirmed
#   rpc_url              transactions, nonce, receipts      canonical/final
# ---------------------------------------------------------------------------

# THE DRIVER. `eth_subscribe("newHeads")` over this socket is what wakes the quote loop;
# measured delivery is 904/1050/966/997ms against a 1s block time. The public GIWA RPC cannot do
# this at all — it answers 405 to a websocket upgrade — which is why the loop used to be a timer.
# Pointing this at an https:// URL is refused at startup: that endpoint answers
# "notifications not supported" and the loop would silently run on its fallback forever.
# NOT ${NODIT_API_KEY}. That key carries the whole read pool's share plus whatever the write path
# falls back to, and it is the one that has actually hit its limit -- when it does, the websocket
# gets `1008 policy violation: API usage quota has been exceeded` and closes before acknowledging
# the subscription.
#
# It also needs a key nothing else touches. `newHeads` pushes about once a second, which is ~86k
# billable events a day on top of whatever else that key carries -- pointing it at a key that was
# already in the read pool exhausted that one too, within minutes. KEY_7 is therefore removed from
# `read_rpc_urls` below and belongs to the subscription alone.
#
# That failure is quiet and expensive. The bot keeps quoting, because the fallback timer is exactly
# the mechanism for a dead subscription -- but `chain_now` falls back to this machine's clock, and
# every quote age, markout stamp and RFQ expiry is then measured against a clock nothing checks.
# Observed: 231 consecutive cycles with heads down and no other symptom.
#
# The websocket still has no fallback list of its own, which is the remaining gap here.
ws_url = "wss://giwa-sepolia.nodit.io/${NODIT_API_KEY_7}"

# TRANSACTIONS AND ANYTHING CANONICAL: nonce, receipts, startup metadata. Defaults to Nodit now
# that it exists — 20 rapid eth_blockNumber calls returned 200 every time, where the public
# endpoint gave us HTTP 429 during a 203-transaction broadcast.
# The write path's primary, and deliberately the keyless public endpoint.
#
# Measured: this path burns 12.38 req/s -- 4.07 sends, 7.31 receipt lookups, 1 eth_getLogs -- which
# is 1.07M requests a day, and `Selection::Pin` puts all of it on ONE key while the seven read keys
# carry 0.87/s each. That is what exhausted the quota and stopped the bot sending: a 14x imbalance
# nobody chose.
#
# The public endpoint has no key and therefore no quota, and nothing on this path needs a keyed
# one: `eth_sendRawTransaction` only has to reach the sequencer, and the in-flight gate no longer
# waits on receipts -- it reads our confirmed nonce out of the chain view, which comes from the
# rotating read pool. The keyed endpoints stay behind this as fallbacks.
# Deliberately NOT the flashblocks endpoint. That was tried and reverted, and the reason is worth
# keeping because it is not obvious.
#
# A flashblocks-aware endpoint returns a receipt as soon as the transaction is preconfirmed, ~200ms,
# rather than when the block seals. It buys nothing here: receipts are only requested after
# `landed_nonce` has passed the transaction, and that nonce is read on the `latest` tag, which is the
# SEALED nonce. The poll therefore cannot happen before sealing however early the answer exists.
# Measured, pointing this at the rate-limited flashblocks endpoint made reported latency WORSE --
# 523ms median to 1319ms -- for no gain at all.
#
# Reading the nonce on `pending` would not fix it either: measured, `pending` runs 0-4 ahead of
# `latest` because it counts our own unsealed sends, so the gate would free slots for transactions
# that have not landed. That is the exact bug the nonce gate exists to prevent.
#
# What the two together mean: our sent-to-confirmed number carries ~700ms of our own polling, and is
# not a measurement of inclusion. Inclusion measured against block timestamps is <= 1 block, which
# is what the explorer also reports.
rpc_url = "https://sepolia-rpc.giwa.io"

# Fallbacks for the write path, tried in order after `rpc_url`.
#
# A quota belongs to a KEY, not to a node. The read pool has rotated over six keys for a while, so
# this was the one path left running on one -- and when that key hit its limit the bot stopped
# sending entirely: 1,448 consecutive `403 API usage quota has been exceeded` while the reader
# carried on without noticing. Raising the cycle to 5/s and adding the 330ms cadence is what got it
# there, so the fix belongs with those changes.
#
# The public endpoint is first because it has no key and therefore no quota; `eth_sendRawTransaction`
# only needs to reach the sequencer, which it does. The keyed endpoints sit behind it as depth.
#
# Selected with Pin, not Rotate: consecutive calls here must see the same node's view of our nonce.
write_rpc_urls = [
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_2}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_3}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_4}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_5}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_6}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_7}",
  # Flashblocks-aware, kept as a last fallback rather than the primary. See the note on `rpc_url`.
  "https://sepolia-rpc-flashblocks.giwa.io",
]

# THE FRESHEST READ, and still worth a separate endpoint. Read-only, and only under the
# `pending` tag: that is where the ~200ms preconfirmed state lives, which is FRESHER than the 1s
# confirmed head that triggered the read. A preconfirmed swap has already moved bidUsed/askUsed,
# and quoting against the pre-swap usage computes the executable top at a point on the ladder the
# pool has already walked past. Its `latest` LAGS the ordinary RPC by about two blocks, so
# reading `latest` here would be strictly worse than reading `latest` there. Transactions do NOT
# go here — a nonce read from a preconfirmed state that reorganises is a stuck transaction.
flashblocks_rpc_url = "https://sepolia-rpc-flashblocks.giwa.io"

# EXTRA READ ENDPOINTS. Rotated with the flashblocks endpoint above, one per call, so the request
# budget is the sum of the keys rather than the smallest of them.
#
# READS ONLY, and the restriction is structural. Transactions, the nonce and receipts all go to
# `rpc_url` and stay pinned there however many of these exist: reading a nonce from a node that has
# not yet seen the previous transaction leaves a gap nothing fills, which is the same hazard as
# reading a nonce from the flashblocks `pending` tag, arriving by a different road.
#
# Templates, never literals. The values live in a gitignored `.env`.
# KEY_7 is deliberately absent: it belongs to the `newHeads` subscription alone. See `ws_url`.
read_rpc_urls = [
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_2}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_3}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_4}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_5}",
  "https://giwa-sepolia.nodit.io/${NODIT_API_KEY_6}",
  # Flashblocks-aware, kept as a last fallback rather than the primary. See the note on `rpc_url`.
  "https://sepolia-rpc-flashblocks.giwa.io",
]

chain_id = 91342
pool = "0xBbE55E29BbC6d71EcAb1ac011c9Ac5206aB2Fe74"

# Preinstalled in GIWA's genesis at the canonical address. This is what makes a whole read
# cycle — block number, block timestamp, both snapshots, three balances — one `eth_call`. KEPT
# after the move to newHeads, and not out of inertia: one round trip per head still beats six
# regardless of any rate limit, and a batch is answered at ONE block where six separate calls
# can straddle a boundary and produce a view that never existed.
multicall3 = "0xcA11bde05977b3631167028862bE2a173976CA11"

# GIWA's cadence. Not a tuning knob — a fact about the chain, and the unit the watchdog below is
# expressed in.
block_time_ms = 1000

# THE HEAD WATCHDOG. No head for this many block times (10s here) means the subscription has
# gone quiet. That is worse than one that errors: a socket which reconnects and then silently
# delivers nothing looks healthy from every angle while the bot sits believing the chain has
# stopped. Tripping it logs loudly and falls back to polling. It deliberately does NOT declare
# the chain down by itself — the block number the next read returns decides that, so a dead
# socket over a live chain keeps quoting and a dead socket over a frozen chain halts.
head_stale_blocks = 10

# Reconnect backoff for the head subscription. A subscription that dies must not become a hot
# reconnect loop against the endpoint.
ws_reconnect_initial_ms = 500
ws_reconnect_max_ms = 30000

# FALLBACK ONLY — this is not the driver any more. It is the floor underneath the subscription,
# so a dead or silent socket degrades into polling rather than stalling. At a healthy 1s head
# cadence it essentially never fires. Sizing it like a primary poll interval is a misreading;
# below `block_time_ms` it is refused at startup precisely because it would quietly become one.
fallback_poll_interval_ms = 2000

# How often the pool re-prices.
#
# This used to be whatever `newHeads` delivered, so one second -- and the posted spread has to cover
# the reference's drift over exactly the re-quote interval, which meant the block time was setting
# the spread. At 200ms that term shrinks by sqrt(5), which is what makes a 1bp floor defensible.
#
# The chain reader publishes every 330ms, so the cycle sees the same view about twice. That is fine:
# the reference is what moves a quote, and it arrives on the venue sockets 115-172 times a second.
quote_interval_ms = 200

# A RUNAWAY GUARD, NOT A BUDGET. This used to be sized against a hostile public endpoint. The
# dedicated endpoint took 20 rapid calls without a 429, so the numbers are now loose enough that
# normal operation never touches them, and the validator no longer refuses an interval on the
# grounds that its steady-state rate would exhaust the budget. What is left is a ceiling on a
# BUG — a reconnect storm or a spinning loop should hit a local limit before the provider's.
requests_per_sec = 25.0
request_burst = 50.0
request_timeout_ms = 8000

# KEPT. A dedicated endpoint is not an infinite one, and with no penalty window any transient
# upstream failure turns this bot into a retry flood — which is how a small outage becomes a
# large one. No socket is opened at all during the window, doubling per consecutive 429.
rate_limit_backoff_initial_ms = 2000
rate_limit_backoff_max_ms = 120000

# Sustained loss of chain liveness: widen first, halt second. "Liveness" is now two signals —
# reads landing AND the block number advancing — on the same thresholds. The second is new and
# closes a real hole: an endpoint that answers every call about a chain that has stopped used to
# read healthy forever.
degraded_after_secs = 30
degraded_extra_half_spread_bps = 25
halt_after_secs = 600

# A view older than this blocks a push even before the connection counts as degraded.
view_stale_secs = 20

[feed]
# ---------------------------------------------------------------------------
# SEVERAL VENUES, AND THE RULES FOR COMBINING THEM.
#
# PUBLIC MARKET DATA ONLY — no API key, no account endpoint, no order entry
# anywhere in this crate, on any venue.
#
# One exchange made the ladder's own price bounds vacuous in exactly the way a
# single-source oracle is: the row and the limits meant to check it came from
# the same number, so a feed that was CONFIDENTLY wrong — a bad parse, a socket
# that stays open serving stale data, an exchange printing garbage mid-outage —
# produced a ladder nothing caught. Three venues give the combiner a
# cross-section to reject against.
#
# The endpoints are NOT listed here. Each venue has a built-in public default
# (feed::VenueId::default_ws_url); add a `[feed.urls]` table only to override
# one. A venue is enabled by a pair naming a symbol for it below, and by
# nothing else — two switches for one venue is two places for them to disagree.
# ---------------------------------------------------------------------------

# A symbol with no accepted tick for this long is stale ON THAT VENUE, and a stale venue
# contributes nothing to the cross-section. Not advisory: the feed type will not hand out a
# price past this point.
stale_after_ms = 5000

reconnect_initial_ms = 500
reconnect_max_ms = 30000

# Every venue here either pushes continuously or answers a keepalive every 20s, so a socket with
# no frame at all for this long is dead whatever TCP thinks. Must be >= stale_after_ms or the
# staleness window is never observable.
read_timeout_ms = 45000

# THE QUORUM. Below this many surviving venues there is no reference price and the bot quotes
# nothing, logging `no_quorum`. Refused below 2 at startup: one venue is the single-source oracle
# this whole arrangement exists to stop being. With three venues configured, losing one still
# quotes and is logged as an event; losing two stops the pair.
min_venues = 2

# THE MAD OUTLIER FILTER. A venue further than `mad_k * MAD` from the cross-venue median is
# dropped for that cycle. MAD *is* the market's current disagreement, so the band widens by
# itself when the market is fast and tightens when it is calm — which is what a fixed band could
# never do, being too wide in a calm market and firing constantly in a fast one.
mad_k = 4.0

# ... and the floor under that band, which is what stops the filter eating itself: when every
# venue agrees to within a tick the MAD collapses to zero and everything but the median would be
# rejected. Measured over 60s of live ETHUSDT and BTCUSDT across Binance/OKX/Bybit on 2026-07-27,
# the MAD ran 0.1-1.0 bps and the largest single-venue deviation seen was 1.6 bps. 2 bps is above
# ordinary disagreement and below anything that matters.
mad_floor_bps = 2.0

# THE REGIME GATE, and the one that matters most. Cross-venue MAD above this means the venues do
# not AGREE — not that one of them is wrong. One venue away from the pack barely moves the MAD;
# half the venues away from the other half moves it to roughly half the gap, and at that point
# the mean of them is a number no venue is showing. The bot refuses to quote rather than
# averaging through a regime change. 25 bps is ~5x the ETH half-spread and ~25x the observed
# calm-market MAD, so it cannot fire on ordinary conditions.
max_dispersion_bps = 25.0

[tx]
# NON-NEGOTIABLE DEFAULT. Nothing is broadcast unless this is explicitly true. `--dry-run`
# forces it off; there is deliberately no flag that turns it on.
transmit_allowed = true

# The key is read from this environment variable. Never a literal, here or anywhere in the
# source. `private_key_file = "..."` is the alternative; setting both is an error.
#
#   export DUBU_UPDATER_KEY=0x...      # must be the pool's `updater`, checked at startup
private_key_env = "DUBU_UPDATER_KEY"

# `updateQuote` for one pair measured 28,747 gas and `refreshCapacity` is cheaper. This is
# several times that because gas here is nearly free and a quote that fails to land is not.
gas_limit = 400000

# Gas on GIWA is 0.001 gwei — the whole 203-transaction demo cost 0.0000156 ETH. There is no fee
# escalator behind these numbers and `tx.rs` explains why at length: at this price the entire
# spread between a minimal tip and an absurd one is worth less than a rounding error on one
# quote. 0.05 gwei is fifty times the observed base fee. If transactions stop landing because
# the base fee genuinely moved, raise this — the pending-intent timeout will say so first.
max_fee_per_gas_gwei = "0.05"
max_priority_fee_per_gas_gwei = "0.005"

# A pair with an unconfirmed transaction is NOT superseded. After this long the intent is
# abandoned (not replaced), the pair is unblocked, and the nonce is resynced from the node.
# 10 seconds, against a measured 440ms median from send to preconfirmation. 120 left a nonce gap
# unnoticed for two minutes, during which the pair is gated and the pool quotes whatever it last
# stored.
pending_timeout_secs = 10

# The cadence (330ms) is shorter than inclusion (~440ms measured), so a send is still in the air
# when the next one is due and the pipeline has to be at least two deep to hold the cadence at all.
# Three leaves one slot for the tail of the inclusion distribution, which is what actually binds --
# 15% of sends land in 2.0-2.75s, and with a depth of two those alone stall the cadence.
#
# Depth is not risk here: updateQuote is an idempotent overwrite, so a send that never lands needs
# no retry and the one behind it supersedes it entirely.
max_in_flight = 3

[skew]
# ---------------------------------------------------------------------------
# INVENTORY SKEW — Avellaneda-Stoikov, linear term only.
#
#   r = s - q * gamma * sigma^2
#
# The bot used to quote symmetrically around the reference regardless of what
# the pool held, so sustained one-way flow accumulated inventory and nothing
# pushed it back. There is NO HEDGE VENUE, so this is not one inventory control
# among several — it is the only one there is.
#
# The load-bearing detail, and the reason to reach for A-S rather than a
# hand-rolled constant: the coefficient scales with sigma^2, NOT with a
# constant. The same imbalance is far more dangerous in a fast market than a
# calm one, and a fixed kappa is wrong in both directions at once.
#
# The derivative and integral terms are DELIBERATELY ABSENT. A PID needs three
# coefficients tuned against replay data we do not have — three numbers picked
# by feel, which archi_v2 5.4 is explicit about not doing. The linear term is
# one coefficient and is provably optimal under the model's assumptions.
# src/skew.rs records what would justify adding the other two.
# ---------------------------------------------------------------------------

# THE VOLATILITY ESTIMATOR. EWMA of squared relative returns, sampled once per quote cycle
# (~1 Hz off newHeads), kept as a per-second variance so cycle-cadence jitter does not bias the
# level, and scaled to the horizon by sqrt-of-time.
#
# tau is the EWMA time constant; the half-life is tau * ln2, about 41s here.
vol_tau_ms = 60000

# THE HORIZON, which is the choice worth arguing about because it sets the range gamma has to
# live in. 300s is the SAME WINDOW as risk.bleed_window_secs below, and that is the whole
# argument: the bleed killswitch already defines the horizon over which an adverse move against
# inventory counts as a real loss rather than noise, and the skew exists to push inventory back
# before that switch has anything to measure. Any other horizon means two parts of one risk
# system disagreeing about what "soon" means.
#
# Not 1s (the cycle cadence): the position being worked off survives orders of magnitude longer
# than one block. Not 3600s (the pool's maxStaleSecs): that is a staleness backstop, not a
# holding horizon, and at that scale sigma^2 barely moves and the skew becomes the constant that
# A-S was chosen over.
vol_horizon_secs = 300

# Samples closer than this are skipped rather than divided by a tiny interval; gaps longer than
# this are an outage, not a return, and the estimator re-anchors instead of entering the whole
# outage as one enormous one-second move.
vol_min_sample_ms = 100
vol_max_sample_ms = 10000

# RISK AVERSION.  skew_bps = gamma * q * sigma_bps^2 / 10000
#
# MEASURED on the live feed, 2026-07-27, over ~200 cycles: sigma across the 300s horizon is about
# 10 bps on ETHUSDT and 3 bps on BTCUSDT. So sigma^2/10000 is 0.01 bp for ETH, and a pool 20%
# away from its target skews 2 bp against a 5 bp half-spread — visible, not dominant. The 30 bp
# cap below is then reached at q * sigma^2 = 300 bps^2, e.g. half the book off target in a market
# 2.5x more volatile than the one measured, which is the right place for a backstop to sit.
#
# This value was FIRST WRITTEN as 100, on a guess that sigma was 30 bps. The measurement said 10.
# Because the skew is quadratic in sigma that guess was wrong by a factor of nine and the applied
# skew rounded to zero on every row. Every row logs (imbalance_ppm, sigma_millibps, raw_decibps,
# applied_bps) precisely so the next correction is a back-solve and not another guess.
#
# Note both pairs share this: BTCUSDT's skew comes out near zero because its imbalance is ~1% and
# its vol is a third of ETH's. That is the model working, not a misconfiguration.
gamma = 1000.0

# THE CLAMP, and it is ASYMMETRIC on purpose.
#
# POSITIVE skew moves the book DOWN: the pool is long, wants to sell, and both its bid and its
# ask fall. The bid falling is defensive and the ask falling is the point. Neither side is a gift
# to a taker, so this one is the looser cap.
#
# NEGATIVE skew moves the book UP: the pool is short base, wants to buy, and its BID rises toward
# and eventually past the reference. A bid above fair value is a free option written to whoever
# notices first — the exact adverse-selection direction the adverse_drift_bps asymmetry below
# exists to defend against — and unlike the positive direction there is no structural floor to
# stop it. So it is capped tighter, and a short book is worked off more slowly than a long one.
# That is the correct trade for a book that cannot hedge: a slow recovery costs volume, a
# picked-off bid costs money. The validator refuses these two the other way round.
#
# Both caps also stop a single wild sigma print from inverting the strategy: sigma^2 is
# quadratic, so a 10x volatility error is a 100x skew error.
#
# The pair's own minPrice floor is folded in on top of max_positive_bps and clamps tighter when
# fair value is near it — logged as clamp="min_price_floor". Clamping there keeps the pool
# quoting a less-skewed book instead of having the row refused outright.
max_positive_bps = 30
max_negative_bps = 10

[spread]
# ---------------------------------------------------------------------------
# THE VOLATILITY-SCALED HALF-SPREAD.
#
#   half_spread = min(s0 + s1 * sigma, cap) + degraded_extra
#
# s0 is each pair's own `half_spread_bps` below; sigma is the SAME 300s estimate
# the skew above uses — there is exactly one volatility estimator in this crate.
#
# WHY THE CONSTANT HAD TO GO. Adverse selection here is entirely a JUMP
# phenomenon: the simulator's pure-diffusion paths produced ZERO informed fills,
# because at 1 bp/s with 2s of quote latency the posted quote is never wrong by
# more than ~1.4 bp against a 5 bp half-spread. Every dollar of the measured
# -$16,580 came from one 100 bp jump. Jumps cluster with volatility, so a
# half-spread that does not move with volatility is a constant premium against a
# hazard that is anything but.
# ---------------------------------------------------------------------------

# s1, IN BPS OF HALF-SPREAD PER BP OF SIGMA. DERIVED, NOT PICKED:
#
#   half-spread   5 bp      15 bp      30 bp      60 bp
#   result     -$15,695   -$8,697     +$566      +$378      (one 100 bp jump, $2M epoch)
#
# 30 bp is the SMALLEST half-spread the sweep MEASURES to be positive — an
# anchor, not a zero interpolated between neighbours, because the relationship is
# not linear (e50 in the arrival hazard is itself tied to the half-spread). The
# remaining question is WHEN the pool should pay it. Not always: a constant 30 bp
# is UniV2's fee and a prop AMM quoting UniV2's fee has no reason to exist. It
# should pay it when a 100 bp jump is a live possibility, and at ETHUSDT's
# measured sigma(300s) of 10 bp a 100 bp gap is a 10-sigma move and is not. At 5x
# that level it is a 2-sigma move and plainly is. So:
#
#   5 + s1 * (5 * 10) = 30   ->   s1 = 25 / 50 = 0.5
#
# What it produces:
#                   sigma(300s)   half-spread   absorption (= hs + width/2)
#   ETHUSDT  1x        10 bp        10.0 bp        22.5 bp
#            2x        20 bp        15.0 bp        27.5 bp
#            5x        50 bp        30.0 bp        42.5 bp   <- the measured point
#   BTCUSDT  1x         3 bp         9.5 bp        29.5 bp
#            2x         6 bp        11.0 bp        31.0 bp
#            5x        15 bp        15.5 bp        35.5 bp
#
# BTC widens far less and should: it is a third as volatile, and its wider ladder
# already absorbs 20 bp before the spread contributes anything. ONE s1 across both
# pairs is only possible because the term is proportional to each pair's own sigma.
#
# THE HONEST COST: ETH's ordinary-market half-spread DOUBLES, 5 bp to 10 bp. The
# simulator cannot see what that costs — it has no competing venue, so its
# uninformed arrival rate does not respond to price, and its own documentation
# says the spread sweep is biased in favour of wider for exactly that reason. So
# this is chosen knowing the model flatters it, and it is the first number to
# back-solve once there is fill data. Set it to 0.0 to restore the old constant
# spread exactly. Every row logs s0, sigma, vol_decibps, half_spread_bps and
# `capped` so the next correction is a back-solve and not another guess.
# RE-DERIVED for a 1 bp floor. s1 is not a taste: it is whatever makes the curve reach
# the cap where the sweep says it must. `s0 + s1 * 50 = 30` gave 0.5 when s0 was 5;
# with s0 = 1 it gives 0.58, which lowers the floor without moving the ceiling one
# basis point.
#
#   sigma(300s)    s0=5,s1=0.50    s0=1,s1=0.58
#          4.1bp        7.05bp          3.38bp
#         10.0bp       10.00bp          6.80bp
#         25.0bp       17.50bp         15.50bp
#         50.0bp       30.00bp         30.00bp   <- unchanged, which is the point
#
# The note above says ETH's ordinary half-spread DOUBLES from 5 to 10 under this term.
# With the floor at 1 it reaches 6.8 instead, so the honest cost accepted there is now
# about a third of what it was.
# Halved from 0.58 on 2026-07-28 to see how tight the pool can quote.
#
# What this spends is a margin nobody has measured. The posted half-spread was 4.0 bp against a
# staleness-window drift of 0.29 bp -- a 13.5-sigma buffer in pure diffusion terms, which is absurd
# for diffusion and is really a buffer against jumps and adverse selection. Neither has ever been
# measured here: third-party flow is zero and markout is empty. The three-lever sweep found s1's
# effect on P&L small and sign-flipping with width, which is the only evidence either way, and it
# says the margin buys little.
#
# So this is not slack that was found. It is an unmeasured safety margin being spent deliberately,
# and it is the first thing to put back if markout ever shows toxicity.
vol_coefficient = 0.29

# THE CAP, and it is 30 bp because that is both the measured-positive point AND
# UniV2's fee. The rule that produces is worth stating plainly: the pool never
# quotes worse than the constant-fee AMM it is trying to beat, it simply does not
# quote 30 bp in a calm market. Above this point widening has stopped being a
# defence at all — the sweep's 60 bp row earns LESS than its 30 bp row — and the
# defence that does work is [jump] below, which stops quoting altogether.
#
# The degraded-chain widening is added AFTER this cap, deliberately: the two
# defend against different failures (a market that is moving vs a chain view that
# cannot be refreshed) and letting one swallow the other would disable the second
# exactly when both are needed. Refused at startup if it is below any pair's own
# half_spread_bps, because the cap bounds the volatility TERM and can never narrow
# the configured spread.
max_half_spread_bps = 30

# STALENESS-SCALED SPREAD: CONSIDERED, NOT IMPLEMENTED. Two reasons, both
# measurements rather than opinions. (1) The horizon already pays for it seventeen
# times over: sigma is scaled to 300s while the loop pushes on a 0.5 bp adverse
# trigger at a 1s cadence, so the 5 bp the term already adds for ETH is covering
# 300 seconds of one-sigma diffusion against an exposure window of one. (2) The one
# regime where staleness is genuinely long already has its own explicit widening,
# chain.degraded_extra_half_spread_bps above — a staleness-scaled spread with a step
# function instead of a ramp, aimed at the case that actually produces long
# staleness. What would change the answer: the `quote_age_secs` field already in
# every decision log line showing a fat tail past a few seconds. See src/spread.rs.

[jump]
# ---------------------------------------------------------------------------
# JUMP DETECTION AND WITHDRAWAL — the first line of defence, and the only one
# that beats a 100 bp gap.
#
#   absorption = half_spread + width/2 = 17.5 bp on pairId 1
#   loss       = (reference error - absorption) x exposed depth
#
# Below the absorption limit the ladder absorbs the error and the pool profits.
# Above it the pool pays the full excess across the whole epoch, and no spread a
# market maker would post fixes that. So the pool STEPS ASIDE:
# refreshCapacity(pairId, 0, 0), which makes PropPool._outFor return zero from
# every quote path, held for a cool-off, then resumed.
#
# THERE IS NO BASIS-POINT THRESHOLD IN THIS TABLE, and that is deliberate. Both
# bounds come from the pair's own half_spread_bps and width_bps:
#
#   threshold = clamp( sigma_k * sigma(dt),  half_spread,  half_spread + width/2 )
#
#   THE FLOOR is the pair's half-spread — the exact point at which the posted
#   quote stops being on the right side of fair value, and comfortably above the
#   measured feed noise (cross-venue MAD 0.1-1.0 bps, worst single-venue
#   deviation 1.6 bps). 5 bp on ETH, 8 bp on BTC. A FIXED bp threshold would be
#   wrong on one of the two pairs whichever value it took.
#
#   THE CEILING is the pair's absorption limit, and it is the answer to the
#   failure a sigma-multiple has on its own. ONE 100 bp return entering a 60s
#   EWMA at dt/tau = 1/60 raises ETH's sigma(1s) from 0.58 bp to ~12.9 bp; at
#   sigma_k = 6 the sigma arm would then ask for a 77 bp move before firing
#   again, so the SECOND LEG of a two-stage jump would sail straight through.
#   Clamping at half_spread + width/2 bounds that numbness with a fact about the
#   ladder rather than a fact about the market.
#
#   THE SIGMA ARM lives between them and its job is the opposite of the naive
#   reading: in a calm market the floor binds and sigma does nothing; as
#   volatility rises it RAISES the bar so the bot does not withdraw on every
#   ordinary swing. For ETH it starts to bind past sigma(300s) ~14 bp (1.4x
#   measured) and is capped out by ~50 bp (5x).
#
# FALSE POSITIVES are quoting outages and they are cheap by four orders of
# magnitude: one 30s outage costs ~$0.48 of foregone spread at the modelled
# uninformed rate (~$122k/h at 4.70 bp), one avoided pick-off is $16,580, so the
# break-even rate is ~34,000:1. The accepted rate is a FEW TRIPS PER PAIR PER DAY,
# about 0.1% of quoting time. At ETH's measured sigma(1s) a 5 bp trip is an
# 8.7-sigma observation. What stops the bias running away is not the economics but
# the mechanics: each withdrawal is a transaction and an in-flight transaction
# blocks the pair, so the cool-off is retriggerable to keep each trip to one.
# ---------------------------------------------------------------------------

# Off restores the previous behaviour exactly: quote through everything.
enabled = true

# The sigma multiplier. It only ever acts BETWEEN the two derived bounds, so
# raising it cannot make the detector numb past the absorption limit and lowering
# it cannot make it fire inside the half-spread. That is why it is the only knob.
sigma_k = 6.0

# THE COOL-OFF, and it is NOT a timer that runs down. It ends when ALL of:
#   1. at least this long has passed SINCE THE MOST RECENT TRIP — retriggerable,
#      so a second leg restarts it rather than shortening it;
#   2. the trailing window of observations has a peak-to-trough RANGE inside the
#      current threshold — the reference has actually settled, which catches the
#      staircase that walks 100 bp in twenty 5 bp steps and never trips the
#      single-observation test;
#   3. the newest observation is fresh, so a dead feed can never satisfy the
#      settle test by having nothing to contradict it.
# (1) is the floor and (3) is a liveness check; (2) is the load-bearing one.
#
# 30s = 30 GIWA blocks, and it is bounded on both sides. Below, it must cover the
# second leg, which arrives in seconds to tens of seconds; a cool-off of one or two
# blocks buys nothing because the ladder is already gone if it was going to be
# taken. Above, it is a quoting outage. It is also half of vol_tau_ms, so a market
# still hot at the end of it has an elevated sigma holding the threshold up.
cooloff_secs = 30

# ACROSS THE BOOK. A BTC jump is information about ETH: the two are 80-90%
# correlated, and in the market-wide case — a macro print, a liquidation cascade,
# an exchange outage — ETH's move is COMING and its feed has simply not printed it
# yet. That window is the searcher's. The asymmetry decides it: contagion's false
# positive is one cool-off of foregone spread on the other pair (~$0.48), its false
# negative is (move - absorption) x $2M. The THRESHOLD stays per-pair; only the
# withdrawal is shared. `pair` disables contagion.
scope = "book"

# THE REACTION TIME, and the one place in this crate where latency genuinely
# matters. The quote loop wakes on newHeads at 1 Hz, which would put mean
# detection latency at 500ms and worst case at 1s. This fast lane runs inside the
# same task between wakes, reads only the in-memory feed snapshots, costs ZERO RPC
# unless something trips, and does not consume a cycle or a chain read. Refused
# above block_time_ms, where it would detect nothing sooner than the ordinary cycle
# and only look like it did.
scan_interval_ms = 200

# THE FEE ON THE WITHDRAWAL, AND ONLY ON IT. tx.rs argues at length against a fee
# escalator and that argument holds for QUOTE traffic: at 0.001 gwei the spread
# between a minimal tip and an absurd one is worth less than a rounding error on
# one quote. A jump withdrawal is the one transaction where the fee buys something
# concrete. GIWA's sequencer has no public mempool and orders by HIGHEST FEE FIRST,
# and the counterparty is by construction someone willing to outbid a quoting bot
# paying a flat near-zero tip. Being 200ms earlier does not win a fee auction;
# paying more does, and it is the difference between the withdrawal landing ahead
# of the pick-off in the same block and landing behind it. At 0.001 gwei base and
# ~29k gas, 0.5 gwei costs about five cents. Still not an escalator: one flat
# number, one kind of transaction, never bumped and never retried higher.
withdraw_priority_fee_per_gas_gwei = "0.5"
withdraw_max_fee_per_gas_gwei = "2.0"

[risk]
# The killswitch latch. Written atomically after every change and read at startup: a halted book
# STAYS DOWN across a restart. Delete this file deliberately to resume.
state_path = "state/killswitch.json"

# Decimals of the shared quote token (mUSDC). Verified against the ERC-20 at startup.
nav_decimals = 6

# BLEED: peak-to-current TOTAL NAV drawdown inside the window. Catches a fast adverse move on
# inventory or a burst of bad fills. This book is unhedged, so a market move against the
# inventory is a real loss, not an accounting artefact.
#
# ~1% of the ~$20M mock book (see DEPLOYMENTS.md: both venues seeded to $20M). Measured: a quiet
# 300s window on live ETHUSDT/BTCUSDT revaluation alone moved NAV ~$20,014 (~0.1%) with zero
# trade PnL, which tripped the old 20000 limit on ordinary noise, not a real adverse event. This
# is a reasoned testnet estimate, not the replay-drawdown back-solve archi_v2 5.4 calls for — redo
# it properly before any real deployment.
bleed_window_secs = 300
bleed_limit = "200000"

# LOSS BUDGET: cumulative gross TRADE-attributable loss, all-time, latching. Trade PnL is
# separated from revaluation exactly (see risk.rs), so a quiet book accumulates nothing and this
# only moves when fills actually cost money. Gross: a later gain does not refund the budget.
#
# ~2.5% of the ~$20M mock book, kept comfortably above bleed_limit per the validator
# (config.rs: budget must be >= bleed_limit). Same caveat as bleed_limit above.
loss_budget = "500000"

# ---------------------------------------------------------------------------
# pairId 1 — mWETH/mUSDC, 18/6 decimals, priceScaleExp 24
# ---------------------------------------------------------------------------
[[pairs]]
pair_id = 1

# IMPORTANT: this is the REAL asset the pool's mock base token stands in for, NOT a market in
# the mock. mWETH is an ERC-20 we deployed and nothing anywhere trades it. Pricing pairId 1 off
# ETHUSDT is what makes the demo live and what will make markout mean something.
#
# It is also the CANONICAL name every venue's ticks are recorded under; each venue's own spelling
# is in [pairs.venues] at the bottom of this block.
symbol = "ETHUSDT"

base_decimals = 18
quote_decimals = 6

# 5 bp either side: a 10 bp round trip, matching the ladder measured in DEPLOYMENTS.md.
half_spread_bps = 1

# Concentration: the price decays at most this far across the WHOLE posted depth. An upper
# bound, not a target — the solver narrows it whenever the fair-value ceiling on maxBid binds.
# Above ~500 bp here the ceiling binds first: the solver lifts maxBid by `W * capture / 2C`, the
# ceiling allows only `half_spread` of lift, so `W <= 2 * 5bp * 1000/20 = 500 bp`.
width_bps = 25

# The jump detector's floor, stated separately from s0 now that s0 is 1 bp.
#
# 5 is the value the detector was validated at, back when half_spread_bps WAS 5 and the floor was
# derived from it. Lowering s0 silently took this to 1 bp, which is below the tick noise of a
# four-venue combined reference: measured, four trips in seven minutes with no jump anywhere, each
# holding capacity at zero for the 30s cool-off. 29% of the run withdrawn for nothing.
jump_floor_bps = 5

# Push at least this often, measured on our own clock.
#
# 330ms is one flashblock, measured at 327ms median on GIWA. The chain-derived heartbeat cannot
# express this: it compares `updatedAt`, a uint32 of SECONDS, so sub-second staleness is invisible
# there. See `policy::Trigger::Cadence`.
#
# Inclusion runs ~440ms, longer than the cadence, so sends pipeline -- max_in_flight has to be
# above 1 for this to hold, and the tail of the inclusion distribution is what will bind.
max_push_interval_ms = 330

# TARGET INVENTORY, as a share of this pair's book — configuration, not a constant, and a share
# rather than an amount so it stays meaningful as the pool grows or shrinks. The book is this
# pair's mWETH valued at the reference plus its share of the shared mUSDC; see skew::Inventory on
# what "its share" means while archi_v2 5.4's cross-asset quote clamp is still unbuilt.
#
# 50 is a balanced book. The pool currently sits above that, so the live skew is positive: it
# quotes slightly lower on both sides and works the position down through its ask.
target_base_share_pct = 50

# The size the half-spread is guaranteed over, on average. Not a size limit — the epoch is
# `bid_capacity`/`ask_capacity` — but the size the quote is honest about.
capture = "20"

bid_capacity = "1000"
ask_capacity = "1000"

# Re-post at least this often. Must sit inside the pool's own maxStaleSecs (3600 here), which is
# checked against the chain at startup; the effective limit is min(this, 0.8 * maxStaleSecs).
# 5 seconds. This is the DEAD-MAN HEARTBEAT, not a refresh convenience.
#
# It was 2400 (two thirds of a 3600s maxStaleSecs), which meant it effectively never fired: every
# push observed on a live run came from adverse_drift instead. That left "the bot is dead" and
# "the market is quiet" looking identical from the chain's side -- measured on pair 2, 12% of the
# intervals between pushes exceeded 15s and one reached 103s, with nothing wrong.
#
# A staleness bound can only be tight if a push is guaranteed, so the push is now guaranteed. This
# is what Binance's Auto-Cancel kill-switch requires of an options market maker for the same
# reason, and what pairDecay / maxStaleSecs on chain are sized against below.
#
# Cost: 2 pairs x 12 pushes a minute x 0.00000012 ETH = 0.0041 ETH a day.
heartbeat_secs = 5

# Drift is measured against the EXECUTABLE TOP at the current usage, never against maxBid.
#
#   adverse    — the market moved AGAINST the posted quote: our bid is now above fair, or our
#                ask below it. This is the pick-off direction, so the threshold is tight.
#   favourable — the posted quote merely became conservative. Costs volume, not money, so the
#                threshold is loose and a quiet market does not churn gas.
#
# This inverts archi_v2 5.3's chase/retreat asymmetry on purpose; policy.rs argues why.
adverse_drift_bps = 0.15
favourable_drift_bps = 3

# Refresh the capacity epoch once remaining capacity falls this far below the planned one.
capacity_divergence_pct = 30

# EVERY VENUE'S OWN SPELLING OF THIS MARKET. Naming a venue here is what enables it; an unknown
# key is a hard error, so `bybbit = ...` fails at startup instead of quietly leaving the pair one
# venue short of the quorum it is written to have.
#
# All three quote against USDT, which is the point. Coinbase is implemented (feed/coinbase.rs)
# and deliberately NOT listed: measured on 2026-07-27, its deep USD books sat a persistent
# +8.4 bps above these three — that is the USDT/USD basis, and against a 5 bp half-spread it is a
# bias wearing the costume of redundancy — while its ETH-USDT book is the right unit but so thin
# that its trade-driven `ticker` channel updated in 4 of 24 samples and would have counted toward
# quorum while contributing nothing.
[pairs.venues]
binance = "ETHUSDT"
okx     = "ETH-USDT"
bybit   = "ETHUSDT"

# ---------------------------------------------------------------------------
# pairId 2 — mWBTC/mUSDC, 8/6 decimals, priceScaleExp 12
# ---------------------------------------------------------------------------
[[pairs]]
pair_id = 2

# Again: the real asset, not the mock. mWBTC has no market.
