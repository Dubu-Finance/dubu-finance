# dubu-updater — GIWA Sepolia (chain 91342), the live deployment in contracts/DEPLOYMENTS.md.
#
# Unknown keys are a hard error, not a silent default, so a typo here fails at startup rather
# than quoting a spread nobody chose. Amounts are decimal strings in HUMAN units (TOML integers
# are i64 and a thousand mWETH is 10^21).
#
# Run it dry:   cargo run -p dubu-updater -- --config crates/dubu-updater/updater.toml --once

[chain]
rpc_url = "https://sepolia-rpc.giwa.io"

# Read-only, and only under the `pending` tag: that is where the ~200ms preconfirmed state
# lives. Its `latest` LAGS the ordinary RPC by about two blocks, so reading `latest` here would
# be strictly worse than reading `latest` there. Transactions go to `rpc_url`, which is
# canonical — a nonce read from a preconfirmed state that reorganises is a stuck transaction.
flashblocks_rpc_url = "https://sepolia-rpc-flashblocks.giwa.io"

chain_id = 91342
pool = "0xA629071E606F425dB93310c3ecc35E00Fbe16358"

# Preinstalled in GIWA's genesis at the canonical address. This is what makes a whole poll
# cycle — block number, block timestamp, both snapshots, three balances — one `eth_call`.
multicall3 = "0xcA11bde05977b3631167028862bE2a173976CA11"

# 1s blocks, so 2s is every other block. Each cycle is exactly one request; the validator
# refuses an interval whose steady-state rate alone would exceed `requests_per_sec`.
poll_interval_ms = 2000

# The public endpoint rate-limits — we measured HTTP 429 during a 203-transaction broadcast.
# The bucket refuses locally rather than queueing, so this bot cannot be what trips the limit.
# The burst covers a send: nonce, submit, and a few receipt polls in quick succession.
requests_per_sec = 3.0
request_burst = 8.0
request_timeout_ms = 8000

# A 429 is a liveness event, not noise. No socket is opened at all during the penalty window,
# and it doubles per consecutive 429 up to the ceiling.
rate_limit_backoff_initial_ms = 2000
rate_limit_backoff_max_ms = 120000

# Sustained polling failure: widen first, halt second.
degraded_after_secs = 30
degraded_extra_half_spread_bps = 25
halt_after_secs = 600

# A view older than this blocks a push even before the connection counts as degraded.
view_stale_secs = 20

[feed]
# Binance combined streams. PUBLIC MARKET DATA ONLY — no API key, no account endpoint, no order
# entry anywhere in this crate. The stream list is built from the per-pair symbols below.
ws_url = "wss://stream.binance.com:9443/stream"

# A symbol with no accepted tick for this long is stale, and a stale feed blocks every push.
# Not advisory: the feed type will not hand out a price past this point.
stale_after_ms = 5000

reconnect_initial_ms = 500
reconnect_max_ms = 30000

# Binance pings every ~20s, so a socket with no frame at all for this long is dead whatever TCP
# thinks. Must be >= stale_after_ms or the staleness window is never observable.
read_timeout_ms = 45000

# Outlier filter. A single bad print is dropped; a genuine fast move is conceded after
# `outlier_tolerance` consecutive ticks at the new level, which on a liquid book is tens of ms.
max_jump_bps = 200
outlier_tolerance = 3

[tx]
# NON-NEGOTIABLE DEFAULT. Nothing is broadcast unless this is explicitly true. `--dry-run`
# forces it off; there is deliberately no flag that turns it on.
transmit_allowed = false

# The key is read from this environment variable. Never a literal, here or anywhere in the
# source. `private_key_file = "..."` is the alternative; setting both is an error.
#
#   export DUBU_UPDATER_KEY=0x...      # must be the pool's `updater`, checked at startup
private_key_env = "DUBU_UPDATER_KEY"

# `updateQuote` for one pair measured 28,747 gas and `refreshCapacity` is cheaper. This is
# several times that because gas here is nearly free and a quote that fails to land is not.
gas_limit = 400000

# Gas on GIWA is 0.001 gwei — the whole 203-transaction demo cost 0.0000156 ETH. There is no fee
# escalator behind these numbers and `tx.rs` explains why at length: at this price the entire
# spread between a minimal tip and an absurd one is worth less than a rounding error on one
# quote. 0.05 gwei is fifty times the observed base fee. If transactions stop landing because
# the base fee genuinely moved, raise this — the pending-intent timeout will say so first.
max_fee_per_gas_gwei = "0.05"
max_priority_fee_per_gas_gwei = "0.005"

# A pair with an unconfirmed transaction is NOT superseded. After this long the intent is
# abandoned (not replaced), the pair is unblocked, and the nonce is resynced from the node.
pending_timeout_secs = 120

[risk]
# The killswitch latch. Written atomically after every change and read at startup: a halted book
# STAYS DOWN across a restart. Delete this file deliberately to resume.
state_path = "state/killswitch.json"

# Decimals of the shared quote token (mUSDC). Verified against the ERC-20 at startup.
nav_decimals = 6

# BLEED: peak-to-current TOTAL NAV drawdown inside the window. Catches a fast adverse move on
# inventory or a burst of bad fills. This book is unhedged, so a market move against the
# inventory is a real loss, not an accounting artefact.
bleed_window_secs = 300
bleed_limit = "20000"

# LOSS BUDGET: cumulative gross TRADE-attributable loss, all-time, latching. Trade PnL is
# separated from revaluation exactly (see risk.rs), so a quiet book accumulates nothing and this
# only moves when fills actually cost money. Gross: a later gain does not refund the budget.
#
# These are demo numbers on a ~$20M mock book. Real thresholds have to be back-solved from a
# replay drawdown, per archi_v2 5.4 — do not pick them by feel.
loss_budget = "100000"

# ---------------------------------------------------------------------------
# pairId 1 — mWETH/mUSDC, 18/6 decimals, priceScaleExp 24
# ---------------------------------------------------------------------------
[[pairs]]
pair_id = 1

# IMPORTANT: this is the REAL asset the pool's mock base token stands in for, NOT a market in
# the mock. mWETH is an ERC-20 we deployed and nothing anywhere trades it. Pricing pairId 1 off
# ETHUSDT is what makes the demo live and what will make markout mean something.
symbol = "ETHUSDT"

base_decimals = 18
quote_decimals = 6

# 5 bp either side: a 10 bp round trip, matching the ladder measured in DEPLOYMENTS.md.
half_spread_bps = 5

# Concentration: the price decays at most this far across the WHOLE posted depth. An upper
# bound, not a target — the solver narrows it whenever the fair-value ceiling on maxBid binds.
# Above ~500 bp here the ceiling binds first: the solver lifts maxBid by `W * capture / 2C`, the
# ceiling allows only `half_spread` of lift, so `W <= 2 * 5bp * 1000/20 = 500 bp`.
width_bps = 25

# Positive shifts the whole book down (the pool is long and wants to sell). Static; an
# inventory-driven skew is listed as not built in the README.
skew_bps = 0

# The size the half-spread is guaranteed over, on average. Not a size limit — the epoch is
# `bid_capacity`/`ask_capacity` — but the size the quote is honest about.
capture = "20"

bid_capacity = "1000"
ask_capacity = "1000"

# Re-post at least this often. Must sit inside the pool's own maxStaleSecs (3600 here), which is
# checked against the chain at startup; the effective limit is min(this, 0.8 * maxStaleSecs).
heartbeat_secs = 2400

# Drift is measured against the EXECUTABLE TOP at the current usage, never against maxBid.
#
#   adverse    — the market moved AGAINST the posted quote: our bid is now above fair, or our
#                ask below it. This is the pick-off direction, so the threshold is tight.
#   favourable — the posted quote merely became conservative. Costs volume, not money, so the
#                threshold is loose and a quiet market does not churn gas.
#
# This inverts archi_v2 5.3's chase/retreat asymmetry on purpose; policy.rs argues why.
adverse_drift_bps = 2
favourable_drift_bps = 8

# Refresh the capacity epoch once remaining capacity falls this far below the planned one.
capacity_divergence_pct = 30

# ---------------------------------------------------------------------------
# pairId 2 — mWBTC/mUSDC, 8/6 decimals, priceScaleExp 12
# ---------------------------------------------------------------------------
[[pairs]]
pair_id = 2

# Again: the real asset, not the mock. mWBTC has no market.
symbol = "BTCUSDT"

base_decimals = 8
quote_decimals = 6

# Wider than ETH: an 8-decimal base at a six-figure price is a coarser tick, and the pool holds
# less of it in notional terms.
half_spread_bps = 8
width_bps = 40
skew_bps = 0

capture = "0.2"
bid_capacity = "20"
ask_capacity = "20"

heartbeat_secs = 2400
adverse_drift_bps = 3
favourable_drift_bps = 12
capacity_divergence_pct = 30
