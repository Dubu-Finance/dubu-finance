# ---------------------------------------------------------------------------
# The RFQ maker endpoint.
#
# Absent means off. Present means this process signs orders that let PmmSettle pull tokens out of
# the maker's balance, so the key is its own -- never tx's. See `maker`'s module docs for why the
# two authorities are not comparable.
#
# `bind` is loopback on purpose. Put a TLS-terminating, rate-limited proxy in front of it before
# anything outside this machine can reach it.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# BNB / XRP / SOL, added 2026-07-28 against the live pool.
#
# `price_scale_exp` is NOT chosen here -- it is derived on chain by `addPair` and read back at
# startup from `snapshot`. Each is different (24 / 15 / 16) because the tokens carry each chain's
# own decimals rather than a uniform 18, which is deliberate: identical decimals never exercise
# `PropCurve`'s alignment path at all.
#
# `half_spread_bps` scales with how twitchy the reference is, not with the price. XRP moves more
# than BNB in relative terms, so it starts wider. These are starting points, not derivations --
# the same caveat that applies to pair 1 and 2 applies here: nothing has measured the adverse
# selection they are supposed to pay for.
# ---------------------------------------------------------------------------

[[pairs]]
