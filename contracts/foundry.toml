[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc_version = "0.8.28"
evm_version = "prague"          # GIWA Sepolia reports EVM version `prague` (TSTORE/TLOAD, MCOPY available)
optimizer = true
optimizer_runs = 1_000_000      # swap/updateQuote are the hot paths; deploy size is not a constraint on an L2
via_ir = false                  # keep off for fast iteration; flip on before the audit build

bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [{access = "read-write", path = "./testdata"}]

[profile.default.fuzz]
runs = 4096
max_test_rejects = 500_000

[profile.default.invariant]
runs = 512
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 50_000

[profile.ci.invariant]
runs = 2048
depth = 128

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
giwa_sepolia = "https://sepolia-rpc.giwa.io"
giwa_sepolia_flashblocks = "https://sepolia-rpc-flashblocks.giwa.io"

[etherscan]
# NOTE: no `chain = 91342` here, and it is not an oversight. Foundry resolves that field through
# alloy-chains' *named* chain table, which has no entry for GIWA, so its presence makes every
# `forge script --rpc-url` invocation against this repo abort with "Chain 91342 not supported"
# before a single line of the script runs — verification flags or not. The alias plus an explicit
# `--verifier blockscout --verifier-url` (which the Makefile always passes) is all Blockscout needs.
giwa_sepolia = {key = "", url = "https://sepolia-explorer.giwa.io/api"}
